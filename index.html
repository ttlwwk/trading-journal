<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Trading Journal</title>

<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#087443;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{max-width:1100px;margin:auto;padding:20px 16px 90px}

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
 gap:10px;
}
.brand{font-size:20px;font-weight:800}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav button{background:transparent;padding:9px 12px;border-radius:9px;color:var(--muted)}
.nav button.active{background:#111827;color:white}
.nav button.backup{background:#eef0f3;color:#111827}

.page{display:none}
.page.active{display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat-label{font-size:13px;color:var(--muted)}
.stat-value{font-size:26px;font-weight:800;margin-top:8px}

.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.section-title{font-size:18px;font-weight:800}

.btn{background:#111827;color:white;padding:10px 14px;border-radius:10px;font-weight:700}
.btn.secondary{background:#eef0f3;color:#111827}

.rules{display:grid;gap:8px}
.rule{padding:10px 12px;background:#f8f9fb;border-radius:10px}

.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.group h3{margin:0 0 10px;font-size:15px}
.stock{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stock:last-child{border-bottom:0}
.x{background:transparent;color:#9ca3af;font-size:18px}

.list{display:grid;gap:10px}
.trade{display:grid;grid-template-columns:1fr auto;gap:12px}
.trade-main{min-width:0}
.trade-title{font-weight:800}
.trade-meta{color:var(--muted);font-size:13px;margin-top:4px}
.trade-notes{margin-top:9px;white-space:pre-wrap;color:#374151}
.pnl.pos{color:var(--green)}
.pnl.neg{color:var(--red)}

.thumb{
 width:100%;
 max-height:260px;
 object-fit:contain;
 border-radius:10px;
 margin-top:10px;
 background:#f3f4f6;
}

.empty{color:var(--muted);padding:25px;text-align:center}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:10;
}
.modal.open{display:flex}

.sheet{
 background:white;
 width:min(680px,100%);
 max-height:92vh;
 overflow:auto;
 border-radius:20px 20px 0 0;
 padding:20px;
}

.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{
 width:100%;
 border:1px solid #d1d5db;
 border-radius:10px;
 padding:11px;
 background:white;
}
.field textarea{min-height:90px;resize:vertical}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.drop{border:1.5px dashed #cbd5e1;padding:18px;text-align:center;border-radius:12px;color:var(--muted)}

.backup-info{
 margin-top:8px;
 padding:10px 12px;
 background:#f8f9fb;
 border-radius:10px;
 color:var(--muted);
 font-size:13px;
 line-height:1.5;
}

.status{
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 background:#111827;
 color:white;
 padding:10px 16px;
 border-radius:10px;
 font-size:13px;
 z-index:30;
 display:none;
 box-shadow:0 4px 15px rgba(0,0,0,.2);
}
.status.show{display:block}

@media(max-width:700px){
 .app{padding:14px 12px 80px}
 header{align-items:flex-start}
 .brand{font-size:17px}
 .nav{gap:4px}
 .nav button{padding:8px 7px;font-size:12px}
 .nav button.backup{padding:8px 9px}
 .stats{gap:7px}
 .card{padding:13px}
 .stat-value{font-size:20px}
 .groups{grid-template-columns:1fr}
 .row{grid-template-columns:1fr}
 .sheet{padding:16px}
 .section-title{font-size:17px}
}
</style>

</head>

<body>

<div class="app">

<header>
<div class="brand">TRADING JOURNAL</div>

<nav class="nav">
<button class="active" data-page="home">홈</button>
<button data-page="trades">매매일지</button>
<button data-page="watch">관심종목</button>
<button class="backup" onclick="openBackup()">백업</button>
</nav>
</header>

<!-- HOME -->

<section id="home" class="page active">

<div class="stats">

<div class="card">
<div class="stat-label">이번 주 손익</div>
<div id="weekPnl" class="stat-value">0</div>
</div>

<div class="card">
<div class="stat-label">승률</div>
<div id="winRate" class="stat-value">0%</div>
</div>

<div class="card">
<div class="stat-label">원칙매매 비율</div>
<div id="ruleRate" class="stat-value">0%</div>
</div>

</div>

<div class="section card">

<div class="section-head">
<div class="section-title">내 매매원칙</div>
<button class="btn secondary" onclick="editRules()">편집</button>
</div>

<div id="rules" class="rules"></div>

</div>

<div class="section card">

<div class="section-head">
<div class="section-title">관심종목</div>
<button class="btn" onclick="openStock()">+ 추가</button>
</div>

<div id="homeWatch"></div>

<button class="btn secondary" style="margin-top:12px;width:100%" onclick="advanceDay()">
D-day 변경
</button>

</div>

<div class="section">

<div class="section-head">
<div class="section-title">최근 매매</div>
<button class="btn secondary" onclick="showPage('trades')">전체 보기</button>
</div>

<div id="recentTrades" class="list"></div>

</div>

</section>

<!-- TRADES -->

<section id="trades" class="page">

<div class="section-head">
<div class="section-title">매매일지</div>
<button class="btn" onclick="openTrade()">+ 매매일지</button>
</div>

<div id="tradeList" class="list"></div>

</section>

<!-- WATCH -->

<section id="watch" class="page">

<div class="section-head">
<div class="section-title">관심종목</div>

<div>
<button class="btn" onclick="openStock()">+ 추가</button>
<button class="btn secondary" onclick="advanceDay()">D-day 변경</button>
</div>

</div>

<div id="watchGroups" class="groups"></div>

</section>

</div>

<!-- TRADE MODAL -->

<div id="tradeModal" class="modal">

<div class="sheet">

<div class="section-head">
<div class="section-title">매매일지 추가</div>
<button class="x" onclick="closeModal('tradeModal')">×</button>
</div>

<div class="field">
<label>종목</label>
<input id="tSymbol" placeholder="예: NVDA">
</div>

<div class="row">

<div class="field">
<label>매매일</label>
<input id="tDate" type="date">
</div>

<div class="field">
<label>손익</label>
<input id="tPnl" type="number" step="0.01" placeholder="예: 127">
</div>

</div>

<div class="field">
<label>손익률 (%)</label>
<input id="tPct" type="number" step="0.01" placeholder="예: 3.2">
</div>

<div class="field">
<label>차트 사진</label>
<input id="tImage" type="file" accept="image/*">
</div>

<div class="field">

<label>원칙매매 여부</label>

<div>
<label>
<input type="radio" name="rule" value="yes" checked> O
</label>
　
<label>
<input type="radio" name="rule" value="no"> X
</label>
</div>

</div>

<div class="field">
<label>잘한 점</label>
<textarea id="tGood"></textarea>
</div>

<div class="field">
<label>잘못한 점</label>
<textarea id="tBad"></textarea>
</div>

<div class="actions">
<button class="btn secondary" onclick="closeModal('tradeModal')">취소</button>
<button class="btn" onclick="saveTrade()">저장</button>
</div>

</div>
</div>

<!-- STOCK MODAL -->

<div id="stockModal" class="modal">

<div class="sheet">

<div class="section-head">
<div class="section-title">관심종목 추가</div>
<button class="x" onclick="closeModal('stockModal')">×</button>
</div>

<div class="field">
<label>종목</label>
<input id="sSymbol" placeholder="예: NVDA">
</div>

<div class="actions">
<button class="btn secondary" onclick="closeModal('stockModal')">취소</button>
<button class="btn" onclick="saveStock()">추가</button>
</div>

</div>
</div>

<!-- RULES MODAL -->

<div id="rulesModal" class="modal">

<div class="sheet">

<div class="section-head">
<div class="section-title">매매원칙 편집</div>
<button class="x" onclick="closeModal('rulesModal')">×</button>
</div>

<div class="field">
<label>원칙을 한 줄에 하나씩 입력</label>
<textarea id="rulesInput" style="min-height:220px"></textarea>
</div>

<div class="actions">
<button class="btn secondary" onclick="closeModal('rulesModal')">취소</button>
<button class="btn" onclick="saveRules()">저장</button>
</div>

</div>
</div>

<!-- BACKUP MODAL -->

<div id="backupModal" class="modal">

<div class="sheet">

<div class="section-head">
<div class="section-title">데이터 백업 / 복원</div>
<button class="x" onclick="closeModal('backupModal')">×</button>
</div>

<div class="backup-info">
현재 휴대폰 브라우저에 저장된 매매일지, 관심종목, 매매원칙을 하나의 백업 파일로 저장할 수 있습니다.<br><br>
휴대폰을 바꾸거나 브라우저 데이터를 삭제하기 전에 반드시 백업 파일을 만들어두세요.
</div>

<div class="actions" style="justify-content:stretch;flex-direction:column;margin-top:14px">

<button class="btn" onclick="backupData()">
데이터 백업하기
</button>

<button class="btn secondary" onclick="document.getElementById('restoreFile').click()">
데이터 복원하기
</button>

<input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(this)">

</div>

<div class="backup-info" style="margin-top:14px">
※ 복원하면 현재 저장된 데이터가 백업 파일의 데이터로 교체됩니다.<br>
※ 복원 전에 현재 데이터를 먼저 백업하는 것을 권장합니다.
</div>

</div>
</div>

<div id="status" class="status"></div>

<script>

const KEY = "tradingJournal_v1";

const DEFAULT_DB = {
 trades: [],
 watch: {
   d0: [],
   d1: [],
   dn: []
 },
 rules: [
   "추격매수하지 않는다.",
   "진입 전에 손절 기준을 정한다.",
   "계획 없는 매매를 하지 않는다."
 ]
};


/* =========================
   데이터 불러오기
========================= */

function loadDB(){

 try{

   const raw = localStorage.getItem(KEY);

   if(!raw){
     return structuredClone(DEFAULT_DB);
   }

   const parsed = JSON.parse(raw);

   if(
     !parsed ||
     !Array.isArray(parsed.trades) ||
     !parsed.watch ||
     !Array.isArray(parsed.watch.d0) ||
     !Array.isArray(parsed.watch.d1) ||
     !Array.isArray(parsed.watch.dn) ||
     !Array.isArray(parsed.rules)
   ){
     throw new Error("저장 데이터 구조가 올바르지 않습니다.");
   }

   return parsed;

 }catch(e){

   console.error("데이터 불러오기 실패:", e);

   alert(
     "저장된 데이터를 읽는 중 문제가 발생했습니다.\n\n" +
     "기존 데이터가 손상되었을 가능성이 있어 기본 데이터로 시작합니다.\n" +
     "백업 파일이 있다면 '백업 → 데이터 복원'으로 복원할 수 있습니다."
   );

   return structuredClone(DEFAULT_DB);
 }

}


let db = loadDB();


/* =========================
   저장
========================= */

function save(){

 try{

   const data = JSON.stringify(db);

   localStorage.setItem(KEY, data);

   render();

   showStatus("저장되었습니다.");

   return true;

 }catch(e){

   console.error("localStorage 저장 실패:", e);

   if(e.name === "QuotaExceededError"){

     alert(
       "저장공간이 부족해서 저장하지 못했습니다.\n\n" +
       "차트 사진이 많이 저장되어 있을 가능성이 높습니다.\n" +
       "먼저 '백업 → 데이터 백업하기'로 백업한 후 오래된 매매일지를 정리해주세요."
     );

   }else{

     alert(
       "데이터 저장에 실패했습니다.\n\n" +
       "현재 화면의 내용은 남아 있을 수 있지만 브라우저에 정상적으로 저장되지 않았을 수 있습니다.\n" +
       "백업 기능을 이용해 데이터를 확인해주세요."
     );

   }

   return false;
 }

}


/* =========================
   상태 메시지
========================= */

let statusTimer = null;

function showStatus(message){

 const el = document.getElementById("status");

 el.textContent = message;
 el.classList.add("show");

 clearTimeout(statusTimer);

 statusTimer = setTimeout(()=>{
   el.classList.remove("show");
 },1800);

}


/* =========================
   기본 함수
========================= */

function money(n){

 return (n>=0?"+":"") +
 Number(n||0).toLocaleString(undefined,{
   maximumFractionDigits:2
 });

}


function weekStart(){

 let d = new Date();

 d.setHours(0,0,0,0);

 let day = d.getDay();

 let diff = (day+6)%7;

 d.setDate(d.getDate()-diff);

 return d;

}


/* =========================
   화면 렌더링
========================= */

function render(){

 let ws = weekStart();

 let wt = db.trades.filter(
   t => new Date(t.date+"T00:00:00") >= ws
 );

 let pnl = wt.reduce(
   (a,t)=>a+Number(t.pnl||0),
   0
 );

 let wins = wt.filter(
   t=>Number(t.pnl)>0
 ).length;


 document.getElementById("weekPnl").textContent = money(pnl);

 document.getElementById("weekPnl").className =
   "stat-value " +
   (pnl>=0 ? "pnl pos" : "pnl neg");


 document.getElementById("winRate").textContent =
   (wt.length ? Math.round(wins/wt.length*100) : 0) + "%";


 document.getElementById("ruleRate").textContent =
   (wt.length ?
      Math.round(
        wt.filter(t=>t.rule).length /
        wt.length * 100
      )
      : 0
   ) + "%";


 document.getElementById("rules").innerHTML =
   db.rules.map(
     x=>`<div class="rule">• ${esc(x)}</div>`
   ).join("")
   ||
   '<div class="empty">아직 원칙이 없습니다.</div>';


 renderWatch();
 renderTrades();

}


/* =========================
   관심종목
========================= */

function renderWatch(){

 const groups = [
   ["d0","D-day"],
   ["d1","D+1"],
   ["dn","D+n"]
 ];

 let html = groups.map(
   ([k,n])=>`

   <div class="group">

   <h3>${n}</h3>

   ${
     db.watch[k].length
     ?
     db.watch[k].map(
       (s,i)=>`

       <div class="stock">

       <b>${esc(s)}</b>

       <button
         class="x"
         onclick="removeStock('${k}',${i})"
       >×</button>

       </div>

       `
     ).join("")
     :
     '<div class="empty">없음</div>'
   }

   </div>

   `
 ).join("");


 document.getElementById("watchGroups").innerHTML = html;

 document.getElementById("homeWatch").innerHTML =
   `<div class="groups">${html}</div>`;

}


/* =========================
   매매일지
========================= */

function renderTrades(){

 const sorted = [...db.trades].sort(
   (a,b)=>b.date.localeCompare(a.date)
 );


 let html = sorted.length

 ?

 sorted.map(
   t=>`

   <div class="card trade">

   <div class="trade-main">

   <div class="trade-title">

   ${esc(t.symbol)}

   <span class="pnl ${t.pnl>=0?'pos':'neg'}">

   ${money(t.pnl)}
   (${Number(t.pct||0)}%)

   </span>

   </div>


   <div class="trade-meta">

   ${t.date} · 원칙매매 ${t.rule?'O':'X'}

   </div>


   ${
     t.image
     ?
     `<img class="thumb" src="${t.image}" alt="차트">`
     :
     ''
   }


   <div class="trade-notes">

   <b>잘한 점</b><br>
   ${esc(t.good||'-')}

   <br><br>

   <b>잘못한 점</b><br>
   ${esc(t.bad||'-')}

   </div>

   </div>


   <button
     class="x"
     onclick="removeTrade('${t.id}')"
   >×</button>

   </div>

   `
 ).join("")

 :

 '<div class="card empty">아직 매매일지가 없습니다.</div>';


 document.getElementById("tradeList").innerHTML = html;


 const recent = sorted.slice(0,3);


 document.getElementById("recentTrades").innerHTML =
   recent.length

   ?

   recent.map(
     t=>`

     <div class="card trade">

     <div>

     <div class="trade-title">

     ${esc(t.symbol)}

     <span class="pnl ${t.pnl>=0?'pos':'neg'}">

     ${money(t.pnl)}

     </span>

     </div>

     <div class="trade-meta">

     ${t.date} · 원칙매매 ${t.rule?'O':'X'}

     </div>

     </div>

     </div>

     `
   ).join("")

   :

   '<div class="card empty">최근 매매가 없습니다.</div>';

}


/* =========================
   XSS 방지
========================= */

function esc(s){

 return String(s??"").replace(
   /[&<>"']/g,
   m=>({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     "\"":"&quot;",
     "'":"&#39;"
   }[m])
 );

}


/* =========================
   페이지
========================= */

function showPage(id){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(id)
 .classList.add("active");


 document.querySelectorAll(".nav button")
 .forEach(
   x=>x.classList.toggle(
     "active",
     x.dataset.page===id
   )
 );

}


/* =========================
   매매일지 추가
========================= */

function openTrade(){

 document.getElementById("tDate").value =
   new Date().toISOString().slice(0,10);

 document.getElementById("tSymbol").value="";
 document.getElementById("tPnl").value="";
 document.getElementById("tPct").value="";
 document.getElementById("tImage").value="";
 document.getElementById("tGood").value="";
 document.getElementById("tBad").value="";

 document.querySelector(
   'input[name="rule"][value="yes"]'
 ).checked=true;

 document.getElementById("tradeModal")
 .classList.add("open");

}


function openStock(){

 document.getElementById("sSymbol").value="";

 document.getElementById("stockModal")
 .classList.add("open");

 setTimeout(
   ()=>document.getElementById("sSymbol").focus(),
   100
 );

}


function closeModal(id){

 document.getElementById(id)
 .classList.remove("open");

}


/* =========================
   이미지 압축
========================= */

function compressImage(file){

 return new Promise((resolve,reject)=>{

   const reader = new FileReader();

   reader.onload = function(e){

     const img = new Image();

     img.onload = function(){

       const MAX_SIZE = 1600;

       let width = img.width;
       let height = img.height;

       if(width > MAX_SIZE || height > MAX_SIZE){

         if(width > height){

           height =
             Math.round(height * MAX_SIZE / width);

           width = MAX_SIZE;

         }else{

           width =
             Math.round(width * MAX_SIZE / height);

           height = MAX_SIZE;

         }

       }


       const canvas = document.createElement("canvas");

       canvas.width = width;
       canvas.height = height;


       const ctx = canvas.getContext("2d");

       ctx.drawImage(
         img,
         0,
         0,
         width,
         height
       );


       const result =
         canvas.toDataURL("image/jpeg",0.75);

       resolve(result);

     };


     img.onerror = ()=>reject(
       new Error("이미지를 읽을 수 없습니다.")
     );

     img.src = e.target.result;

   };


   reader.onerror = ()=>reject(
     new Error("파일을 읽을 수 없습니다.")
   );

   reader.readAsDataURL(file);

 });

}


/* =========================
   매매일지 저장
========================= */

async function saveTrade(){

 const symbol =
   document.getElementById("tSymbol")
   .value.trim()
   .toUpperCase();


 const date =
   document.getElementById("tDate").value;


 if(!symbol){

   alert("종목을 입력해주세요.");

   return;

 }


 if(!date){

   alert("매매일을 입력해주세요.");

   return;

 }


 const file =
   document.getElementById("tImage")
   .files[0];


 const finish = image=>{

   db.trades.push({

     id:Date.now().toString(),

     symbol,

     date,

     pnl:Number(
       document.getElementById("tPnl").value||0
     ),

     pct:Number(
       document.getElementById("tPct").value||0
     ),

     image,

     rule:
       document.querySelector(
         'input[name="rule"]:checked'
       ).value==="yes",

     good:
       document.getElementById("tGood").value,

     bad:
       document.getElementById("tBad").value

   });


   const success = save();


   if(success){

     closeModal("tradeModal");
     showPage("trades");

   }

 };


 if(file){

   try{

     showStatus("차트 사진을 처리하는 중...");

     const compressed =
       await compressImage(file);

     finish(compressed);

   }catch(e){

     console.error(e);

     alert(
       "차트 사진을 처리하지 못했습니다.\n\n" +
       "사진 없이 저장하거나 다른 사진을 선택해주세요."
     );

   }

 }else{

   finish("");

 }

}


/* =========================
   관심종목 저장
========================= */

function saveStock(){

 let s =
   document.getElementById("sSymbol")
   .value.trim()
   .toUpperCase();


 if(!s)return;


 if(
   !db.watch.d0.includes(s) &&
   !db.watch.d1.includes(s) &&
   !db.watch.dn.includes(s)
 ){

   db.watch.d0.push(s);

 }


 closeModal("stockModal");

 save();

}


/* =========================
   관심종목 삭제
========================= */

function removeStock(g,i){

 db.watch[g].splice(i,1);

 save();

}


/* =========================
   D-day 이동
========================= */

function advanceDay(){

 db.watch.dn = [
   ...db.watch.dn,
   ...db.watch.d1
 ];

 db.watch.d1 = [
   ...db.watch.d0
 ];

 db.watch.d0 = [];

 save();

}


/* =========================
   매매일지 삭제
========================= */

function removeTrade(id){

 if(
   confirm("이 매매일지를 삭제할까요?")
 ){

   db.trades =
     db.trades.filter(
       t=>t.id!==id
     );

   save();

 }

}


/* =========================
   매매원칙 편집
========================= */

function editRules(){

 document.getElementById("rulesInput")
 .value =
 db.rules.join("\n");

 document.getElementById("rulesModal")
 .classList.add("open");

}


function saveRules(){

 db.rules =
   document.getElementById("rulesInput")
   .value
   .split("\n")
   .map(x=>x.trim())
   .filter(Boolean);

 closeModal("rulesModal");

 save();

}


/* =========================
   백업 메뉴
========================= */

function openBackup(){

 document.getElementById("backupModal")
 .classList.add("open");

}


/* =========================
   데이터 백업
========================= */

function backupData(){

 try{

   const backup = {

     app:"Trading Journal",

     version:1,

     backupDate:new Date().toISOString(),

     data:db

   };


   const json =
     JSON.stringify(
       backup,
       null,
       2
     );


   const blob =
     new Blob(
       [json],
       {type:"application/json"}
     );


   const url =
     URL.createObjectURL(blob);


   const a =
     document.createElement("a");

   a.href=url;

   a.download =
     "trading-journal-backup-" +
     new Date()
     .toISOString()
     .slice(0,10) +
     ".json";


   document.body.appendChild(a);

   a.click();

   a.remove();

   URL.revokeObjectURL(url);


   showStatus("백업 파일을 저장했습니다.");

 }catch(e){

   console.error(e);

   alert(
     "백업 파일을 만들지 못했습니다.\n\n" +
     e.message
   );

 }

}


/* =========================
   데이터 복원
========================= */

function restoreData(input){

 const file =
   input.files[0];


 if(!file){

   return;

 }


 if(
   !confirm(
     "현재 저장된 데이터가 백업 파일의 데이터로 교체됩니다.\n\n" +
     "복원하기 전에 현재 데이터를 백업했는지 확인해주세요.\n\n" +
     "계속하시겠습니까?"
   )
 ){

   input.value="";

   return;

 }


 const reader =
   new FileReader();


 reader.onload = function(e){

   try{

     const backup =
       JSON.parse(e.target.result);


     let restored;


     /* 새 백업 형식 */

     if(
       backup &&
       backup.app==="Trading Journal" &&
       backup.data
     ){

       restored = backup.data;

     }

     /* 혹시 예전 형식의 db 파일을 직접 복원하는 경우 */

     else if(
       backup &&
       Array.isArray(backup.trades) &&
       backup.watch &&
       Array.isArray(backup.rules)
     ){

       restored = backup;

     }

     else{

       throw new Error(
         "올바른 Trading Journal 백업 파일이 아닙니다."
       );

     }


     /* 데이터 구조 검사 */

     if(
       !Array.isArray(restored.trades) ||
       !restored.watch ||
       !Array.isArray(restored.watch.d0) ||
       !Array.isArray(restored.watch.d1) ||
       !Array.isArray(restored.watch.dn) ||
       !Array.isArray(restored.rules)
     ){

       throw new Error(
         "백업 데이터의 구조가 올바르지 않습니다."
       );

     }


     /* 실제 저장 테스트 */

     const testData =
       JSON.stringify(restored);


     localStorage.setItem(
       KEY,
       testData
     );


     /* 메모리 데이터 교체 */

     db = restored;


     render();


     closeModal("backupModal");


     alert(
       "데이터 복원이 완료되었습니다."
     );


   }catch(e){

     console.error(
       "복원 실패:",
       e
     );


     alert(
       "데이터 복원에 실패했습니다.\n\n" +
       e.message +
       "\n\n현재 데이터는 변경되지 않았습니다."
     );

   }


   input.value="";

 };


 reader.onerror = function(){

   alert(
     "백업 파일을 읽지 못했습니다."
   );

   input.value="";

 };


 reader.readAsText(file);

}


/* =========================
   메뉴 버튼
========================= */

document.querySelectorAll(".nav button").forEach(
 b=>{

   if(b.dataset.page){

     b.onclick =
       ()=>showPage(
         b.dataset.page
       );

   }

 }
);


/* =========================
   모달 바깥 클릭 닫기
========================= */

document.querySelectorAll(".modal").forEach(
 modal=>{

   modal.addEventListener(
     "click",
     e=>{

       if(e.target===modal){

         modal.classList.remove("open");

       }

     }
   );

 }
);


/* =========================
   시작
========================= */

render();

</script>

</body>
</html>
